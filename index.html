<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Journey-HVAC</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B3041">
    <script>
      /* Host-aware install branding — MUST run in <head> before the browser/iOS
         reads the title/manifest/apple-touch-icon for "Add to Home Screen". */
      (function () {
        var portalHosts = ['portal.journey-hvac.app', 'air-careconnect.app'];
        if (portalHosts.indexOf(location.hostname) !== -1) {
          var m = document.querySelector('link[rel="manifest"]');
          if (m) m.setAttribute('href', '/portal.webmanifest');
          var ati = document.querySelector('link[rel="apple-touch-icon"]');
          if (ati) ati.setAttribute('href', '/portal-icon.png');
          var t = document.createElement('meta');
          t.setAttribute('name', 'apple-mobile-web-app-title');
          t.setAttribute('content', 'Air-Care Connect');
          document.head.appendChild(t);
          var cap = document.createElement('meta');
          cap.setAttribute('name', 'apple-mobile-web-app-capable');
          cap.setAttribute('content', 'yes');
          document.head.appendChild(cap);
          document.title = 'Air-Care Connect';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
